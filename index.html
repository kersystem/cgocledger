:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#ecebe6;--mut:#a09f98;--bd:#383835;--ac:#4fc3a1;--acl:#1b3a31;--out:#f09595;--outl:#3d2323}

button,input,select{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px}
button{cursor:pointer}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.step{font-size:12px;color:var(--mut);width:100%}
.big{flex:1;min-width:110px;padding:12px;font-weight:600;text-align:center}
.on,.on.o{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sv{text-align:center;min-height:68px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;border-radius:999px;padding:10px 18px;background:var(--acl)}

.toast button{padding:4px 10px}.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500}.n{text-align:right}.i{color:var(--ac)}.u{color:var(--out)}.m{color:var(--mut)}
.lg-d{display:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:inline}}:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:inline}.tabs button{flex:1}#pa{display:none}#pa th,#pa td{white-space:normal}@media print{body{background:#fff!important}.w{display:none!important}#pa{display:block!important}}.lgb{flex:1;min-width:140px;height:104px;display:flex;align-items:center;justify-content:center;padding:8px;border-width:2px}.lgb img{max-height:84px;max-width:100%;object-fit:contain;border-radius:8px}.lgb.sel,.lgb:active{border-color:var(--red);box-shadow:0 0 0 3px var(--red)}button:disabled{opacity:.45;cursor:not-allowed}.lay{display:grid;grid-template-columns:1fr clamp(380px,34vw,560px);gap:16px;align-items:start}.inv{position:sticky;top:8px;order:2;min-height:78vh;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:6px 6px 14px 14px}.inv h2{text-align:center;font-size:18px;color:var(--tx);text-transform:none;letter-spacing:0;border-bottom:2px dashed var(--bd);padding-bottom:8px}.il{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}.il button{padding:2px 8px}@media(max-width:720px){.lay{grid-template-columns:1fr}.inv{position:static;order:0;min-height:0}}

/* ===== Design system: company colors + Cash In / Cash Out ===== */
:root{--tala:#183060;--ling:#c9803c;--brain:#9b1c1c;--pay-on:#1e5fa8;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tala:#5b82c8;--ling:#e0a060;--brain:#d95a5a;--pay-on:#6aa6ec}}
:root[data-theme="dark"]{--tala:#5b82c8;--ling:#e0a060;--brain:#d95a5a;--pay-on:#6aa6ec}
body{--co:var(--red)}
body[data-co=tala]{--co:var(--tala)}body[data-co=ling]{--co:var(--ling)}body[data-co=brain]{--co:var(--brain)}
.tint{background:color-mix(in srgb,var(--co) 9%,var(--card))}
/* tabs */
.tabs{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:5px;gap:5px;margin-bottom:10px}
.tabs button{border:0;background:transparent;font-weight:600;padding:10px 8px}
.tabs button.on{background:var(--red)!important;color:#fff!important}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--mut);margin:0 0 12px;padding:8px 12px;background:var(--card);border:1px dashed var(--bd);border-radius:var(--r)}
.legend>span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* badges */
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.bd.in{background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac)}
.bd.out{background:color-mix(in srgb,var(--out) 14%,var(--card));color:var(--out)}
.bd.cash{background:color-mix(in srgb,#b8860b 16%,var(--card));color:#8a6508}
.bd.onl{background:color-mix(in srgb,var(--pay-on) 16%,var(--card));color:var(--pay-on)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bd.cash{color:#e5b84a}}
:root[data-theme="dark"] .bd.cash{color:#e5b84a}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600}.chip:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[data-k=tala]{--c:var(--tala)}.chip[data-k=ling]{--c:var(--ling)}.chip[data-k=brain]{--c:var(--brain)}
/* step cards */
.stp{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--co);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.stp .step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tx);text-transform:uppercase;letter-spacing:.03em}
.stp .step i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--co);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
[data-a=dir][data-v=in]:not(.on){border-color:var(--ac);color:var(--ac);background:var(--acl)}
[data-a=dir][data-v=out]:not(.on){border-color:var(--out);color:var(--out);background:var(--outl)}
/* company buttons */
.lgb{border-top-width:7px!important}
.lgb[data-k=tala]{border-top-color:var(--tala)}.lgb[data-k=ling]{border-top-color:var(--ling)}.lgb[data-k=brain]{border-top-color:var(--brain)}
/* service buttons follow the active company */
.sv{background:color-mix(in srgb,var(--co) 10%,var(--card));border:2px solid color-mix(in srgb,var(--co) 45%,var(--card))}
.sv.o{background:color-mix(in srgb,var(--co) 10%,var(--card))}
.sv.o span{color:var(--out)}.sv:not(.o) span{color:var(--ac)}
.sv.sel span,.sv:active span{color:#fff!important}
section h2,.ttl{color:var(--tx)!important;border-left:6px solid var(--co);padding:4px 0 4px 10px;background:color-mix(in srgb,var(--co) 9%,transparent);border-radius:0 8px 8px 0;text-transform:none!important;font-size:15px}
.ttl{font-size:18px!important;margin:6px 0 10px}
/* invoice */
.inv{border-top:8px solid var(--co)!important}
.inv .il{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.stat{border-radius:var(--r);padding:10px 14px;border:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.stat b{font-size:20px}
.stat.in{border-left:6px solid var(--ac)}.stat.in b{color:var(--ac)}
.stat.out{border-left:6px solid var(--out)}.stat.out b{color:var(--out)}
.stat.net{border-left:6px solid var(--co)}
/* toolbar */
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tool label{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.tool .sp{flex:1}
/* tables */
.card.ov thead th{background:var(--co);color:#fff;font-weight:600;position:sticky;top:0}
.card.ov tbody tr:nth-child(even){background:color-mix(in srgb,var(--co) 5%,transparent)}
tr.in td:first-child{box-shadow:inset 5px 0 0 var(--ac)}tr.out td:first-child{box-shadow:inset 5px 0 0 var(--out)}
tbody tr:hover{background:color-mix(in srgb,var(--co) 12%,transparent)!important}

.secbar{margin:16px 0 8px;padding:9px 14px;border-radius:10px;background:var(--co);color:#fff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.ist{min-width:480px}.ist td{white-space:normal}.ist td:first-child{width:100%}
.ist tbody tr,.ist tbody tr:hover,.card.ov .ist tbody tr:nth-child(even){background:none!important}
.ist tr.h td{background:color-mix(in srgb,#888 22%,transparent)!important;font-weight:700}
.ist tr.sh td{font-weight:700;padding-top:10px}
.ist tr.a td:first-child{padding-left:16px}
.ist tr.s td{color:var(--mut);font-size:12px;padding-top:2px;padding-bottom:2px}.ist tr.s td:first-child{padding-left:38px}
.ist tr.t td{font-weight:700;border-top:1.5px solid var(--tx)}
.ist tr.g td{font-weight:700;background:color-mix(in srgb,var(--co) 14%,transparent)!important;border-top:2px solid var(--tx)}
.ist tr.p td{font-style:italic}.ist tr.b td{padding:3px}
.ist thead th{background:var(--co);color:#fff}
#pa .isp{font:12px/1.35 Arial,sans-serif;background:#fff;color:#111;max-width:760px;margin:0 auto;padding:10px}
#pa .isp td{color:#111;border-bottom:1px solid #ddd;padding:3px 6px}#pa .isp thead th{color:#fff}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== Claude-website look: cream, serif headings, collapsible sidebar ===== */
:root{--bg:#faf9f5;--card:#ffffff;--bd:#e6e3d8;--mut:#7b796f;--tx:#1f1e1d;--side:#f3f1ea;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--card:#30302e;--bd:#45443f;--mut:#a9a79d;--tx:#f3f2ec;--side:#1f1e1d}}
:root[data-theme="dark"]{--bg:#262624;--card:#30302e;--bd:#45443f;--mut:#a9a79d;--tx:#f3f2ec;--side:#1f1e1d}
.w{padding:0!important}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.ttl,.pg,.empty h1,.crumb b,.inv h2{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.01em}
.pg{font-size:30px;margin:6px 0 16px;color:var(--tx)}.pg span{color:var(--mut);font-size:20px;margin-left:6px}
button,input,select{border-radius:12px}
button:not(.on):not(.sel):not(.sv):not(.scrim):not(.ic):hover{background:color-mix(in srgb,var(--tx) 5%,var(--card))}
.card,.stp,.stat{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.shell{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
.sb{background:var(--side);border-right:1px solid var(--bd);padding:16px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.shell.sb-off{grid-template-columns:0 minmax(0,1fr)}
.shell.sb-off .sb{visibility:hidden;padding:0;border:0;overflow:hidden}
.sbtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sbtop img.lg-l{display:none}:root:not([data-theme="light"]) .sbtop img.lg-d{display:block}}
:root[data-theme="dark"] .sbtop img.lg-l{display:none}:root[data-theme="dark"] .sbtop img.lg-d{display:block}
.ic{border:0;background:transparent;padding:8px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
.ic:hover{background:color-mix(in srgb,var(--tx) 8%,transparent)!important;color:var(--tx)}
.sblbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 6px 4px}
.sbnav{display:flex;flex-direction:column;gap:2px}
.sbnav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;font-weight:500}
.sbnav button:hover{background:color-mix(in srgb,var(--tx) 6%,transparent)!important}
.sbnav button.on{background:color-mix(in srgb,var(--red) 12%,var(--card))!important;color:var(--red)!important;font-weight:700}
.cos{display:flex;flex-direction:column;gap:8px}
.cob{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c,var(--red));border-radius:12px}
.cob img{width:54px;height:36px;object-fit:contain;border-radius:6px;flex:none}.cob span{font-weight:600;font-size:14px;line-height:1.2}
.cob[data-k=tala]{--c:var(--tala)}.cob[data-k=ling]{--c:var(--ling)}.cob[data-k=brain]{--c:var(--brain)}
.cob.sel{border-color:var(--red);border-left-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent);background:color-mix(in srgb,var(--red) 6%,var(--card))}
.sb .legend{flex-direction:row;font-size:11px;margin:0;padding:8px 10px;gap:6px 10px}

.mn{min-width:0}
.mnbar{display:flex;align-items:center;gap:10px;padding:12px 24px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:4;border-bottom:1px solid transparent}
